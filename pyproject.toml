[project]
name = "logo-gen"
version = "0.2.0"
description = "Logo and icon generator with a chat designer, OpenRouter image models and local diffusion models"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Duoquote", email = "16341937+Duoquote@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.0.0",
    "numpy>=2.0",
    "onnxruntime>=1.24.4",
    "opencv-python-headless>=4.10.0",
    "pillow>=12.1.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "rembg>=2.0.74",
    "uvicorn>=0.34.0",
]

# Local model support is not installed by default. The app adds it the first
# time you install a local model (or run `./logo-gen --with-local`), together
# with exactly one PyTorch build: cpu, cu126 or cu130.
[project.optional-dependencies]
local = [
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.2; sys_platform != 'darwin'",
    "diffusers>=0.43.0",
    "protobuf>=5.29",
    "sentencepiece>=0.2.1",
    "spandrel>=0.4.2",
    "transformers>=5.0.0",
]
cpu = ["torch>=2.9.0", "torchvision>=0.24.0"]
cu126 = ["torch>=2.9.0", "torchvision>=0.24.0"]
cu130 = ["torch>=2.9.0", "torchvision>=0.24.0"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
logo-gen = "logo_gen.cli:main"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.9.18,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 140

[tool.pytest.ini_options]
testpaths = ["tests"]
